name: trading_edge_app
description: Trading at the Edge - On-Device AI Trading Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP & API
  http: ^1.1.0
  web_socket_channel: ^2.4.0
  
  # Charts
  fl_chart: ^0.65.0
  
  # State Management
  provider: ^6.1.1
  
  # Storage
  shared_preferences: ^2.2.2
  
  # UI
  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  
  # Utils
  intl: ^0.18.1
  cupertino_icons: ^1.0.2

  # QR Code
  qr_flutter: ^4.1.0

  # URL Launcher
  url_launcher: ^6.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
